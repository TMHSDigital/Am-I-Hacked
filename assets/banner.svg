<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 120" width="860" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#1a1d2e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="60%" style="stop-color:#f87171"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="120" fill="url(#bg)" rx="8"/>

  <!-- Subtle top border line -->
  <rect width="860" height="2" fill="#ef4444" opacity="0.6" rx="1"/>

  <!-- Main title -->
  <text
    x="430" y="62"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="900"
    text-anchor="middle"
    letter-spacing="6"
    fill="url(#textGrad)"
  >AM I HACKED?</text>

  <!-- Subtitle -->
  <text
    x="430" y="92"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="400"
    text-anchor="middle"
    letter-spacing="3"
    fill="#71717a"
  >WINDOWS SECURITY ASSESSMENT TOOL</text>

  <!-- Bottom border line -->
  <rect y="118" width="860" height="2" fill="#ef4444" opacity="0.6" rx="1"/>
</svg>
